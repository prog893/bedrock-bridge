name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: offline tests
        run: |
          uv venv
          uv pip install -e '.[dev]'
          .venv/bin/pytest -m 'not functional'
